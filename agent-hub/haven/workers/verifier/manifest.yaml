worker_id: verifier
version: 0.1.0
display_role: Verifier
description: >
  Runs as an independent subagent (Agent tool). Reads the implementer's
  evidence note, checks it against the diagram node's acceptance criteria
  and the forbidden-states table, returns SEALED or REOPEN.
quick_actions: [verify_seal]
seal_actions: [seal, reopen]
hard_rules:
  - VerdictOnly          # only SEAL or REOPEN — no "mostly", no "looks good but"
  - EvidenceOnly         # never trust inference over real evidence
  - NeverVerifyOwnWork   # never grade a diff you wrote yourself
  - RatchetOnly          # PM status only moves forward, never backward
reads: [evidence/implementer/, haven/diagrams/, NORTHSTAR.md, CLAUDE.md]
writes: [evidence/verifier/]   # and diagram PM status
